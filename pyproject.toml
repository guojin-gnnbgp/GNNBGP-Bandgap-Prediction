[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bandgap-predictor"
version = "0.1.0"
description = "Unified local band-gap prediction with GNN and ABACUS backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ase>=3.23",
  "click>=8.1",
  "numpy>=1.26,<2.5",
  "platformdirs>=4.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
gnn = [
  "e3nn>=0.4.4",
  "mace-torch==0.3.9",
  "monty>=2024.7",
  "torch==2.10.0",
]

[project.scripts]
bgp = "bandgap_predictor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bandgap_predictor", "src/gnnbgp"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "bandgap_predictor/data"
"examples" = "bandgap_predictor/examples"
"vendor/abacus/UPSTREAM.md" = "bandgap_predictor/data/abacus-source/UPSTREAM.md"
"vendor/abacus/INTEGRATION_PATCHES.md" = "bandgap_predictor/data/abacus-source/INTEGRATION_PATCHES.md"
"vendor/abacus/LICENSE" = "bandgap_predictor/data/abacus-source/LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "extended: extended scientific regression suite",
  "gnn: requires legacy GNN dependencies",
  "hardware: requires local MPI and GPU",
]

[tool.ruff]
extend-exclude = ["src/gnnbgp", "vendor/abacus"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
